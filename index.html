<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudransh Srivastava | Freelance Web Developer</title>
    
    <!-- CSS Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #030712;
            color: #ffffff;
        }

        /* Matrix Canvas Background Layer */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main Scrollable Layout Wrapper */
        .page-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Content Hero Section Container */
        .hero-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Premium Glassmorphic Card */
        .glass-box {
            background: rgba(3, 7, 18, 0.75);
            border: 1px solid rgba(0, 255, 70, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 255, 70, 0.05);
        }

        .status-badge {
            display: inline-block;
            color: #00ff46;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #00ff46;
            padding: 6px 18px;
            border-radius: 50px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .highlight {
            color: #00ff46;
            text-shadow: 0 0 15px rgba(0, 255, 70, 0.4);
        }

        h2 {
            color: #e2e8f0;
            font-size: 1.6rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        #typing-text {
            color: #38bdf8;
        }

        .cursor {
            color: #38bdf8;
            font-weight: 300;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        /* Interactive Contact Form Styling */
        .contact-form {
            text-align: left;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
        }

        .form-title {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #00ff46;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 10px rgba(0, 255, 70, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: #00ff46;
            color: #000000;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #00cc38;
            box-shadow: 0 0 20px rgba(0, 255, 70, 0.5);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Background Canvas Rendering Matrix Frame -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Scrollable View Layer Wrapper -->
    <div class="page-wrapper">
        <section class="hero-container">
            <div class="glass-box">
                <span class="status-badge">🟢 Available for Freelance Work</span>
                <h1>Hi, I am <span class="highlight">Rudransh Srivastava</span></h1>
                <h2>I am a <span id="typing-text"></span><span class="cursor">|</span></h2>
                <p>Crafting modern, high-performance, and conversion-focused digital web solutions with clean and optimized source code.</p>
                
                <!-- ⬇️ यहाँ नीचे डायरेक्ट इनबिल्ट कॉन्टैक्ट फॉर्म है ⬇️ -->
                <div class="contact-form">
                    <div class="form-title">Send a Direct Message</div>
                    <form id="fs-form" action="https://formspree.io" method="POST">
                        <div class="form-group">
                            <label>Your Name</label>
                            <input type="text" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Your Contact Info (Email/Social)</label>
                            <input type="text" name="contact" placeholder="email@example.com or @username" required>
                        </div>
                        <div class="form-group">
                            <label>Project Details</label>
                            <textarea name="message" rows="4" placeholder="Tell me about your website idea..." required></textarea>
                        </div>
                        <button type="submit" class="btn-submit">Submit Proposal</button>
                    </form>
                </div>
                
            </div>
        </section>
    </div>

    <!-- JavaScript Control Loop Architecture -->
    <script>
        // --- 1. Cyberpunk Matrix Digital Rain Effect ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const symbols = "01010101XYZ<>[]={}+-*$#@!#%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 12, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff46';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = symbols.charAt(Math.floor(Math.random() * symbols.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 33);


        // --- 2. Dynamic Typewriter Animation System ---
        const roles = ["Frontend Developer.", "Freelance Web Expert.", "UI/UX Specialist.", "Clean Code Architect."];
        let roleIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typingTarget = document.getElementById("typing-text");

        function typeAnimation() {
            const currentRole = roles[roleIndex];
            
            if (isDeleting) {
                typingTarget.textContent = currentRole.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typingTarget.textContent = currentRole.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 40 : 80;

            if (!isDeleting && charIndex === currentRole.length) {
                typeSpeed = 2200; 
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                roleIndex = (roleIndex + 1) % roles.length; 
                typeSpeed = 400;
            }

            setTimeout(typeAnimation, typeSpeed);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(typeAnimation, 800);
        });
    </script>
</body>
</html>
